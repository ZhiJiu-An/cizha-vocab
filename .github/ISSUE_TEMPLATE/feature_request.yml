name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看 README 的 Roadmap，确认该方向是否已在「暂不在范围内」中列出。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景与痛点，而不是直接给方案
      placeholder: 背单词时经常遇到……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法或现有的临时绕行方式
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 词典查询
        - 词库管理
        - 复习与提醒
        - 统计
        - 模型配置
        - 部署与安装
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 已搜索现有 Issue，未发现重复
          required: true
        - label: 已确认该方向不在 README 的「暂不在范围内」列表中
          required: true
