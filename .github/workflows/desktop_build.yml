name: 桌面 App 构建

on:
  push:
    tags:
      - "v*"   # v0.2.0、v1.0.0 都触发

permissions:
  contents: write   # 需要创建 Release + 上传附件

jobs:
  # -------- 三条并行：各平台 PyInstaller 打包 --------
  build-binaries:
    name: 构建 (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # 一个平台挂了不影响另外两个
      matrix:
        include:
          - runner: macos-latest     # arm64
            platform: darwin-arm64
          - runner: ubuntu-latest    # amd64
            platform: linux-amd64
          - runner: windows-latest   # amd64
            platform: windows-amd64

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖 + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端 dist
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Windows runner 命令行语法不同，用 shell: bash 统一
      - name: PyInstaller 打包
        shell: bash
        run: |
          cd backend
          python -m PyInstaller ../build/pyinstaller/cizha-backend.spec \
              --noconfirm \
              --workpath ../_pybuild \
              --distpath ../dist \
              --clean

      - name: 重命名产物（带平台后缀）
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          SRC="dist/cizha-backend"
          if [[ "${{ matrix.platform }}" == "windows-amd64" ]]; then
              SRC="${SRC}.exe"
          fi
          if [[ ! -f "$SRC" ]]; then
              echo "❌ 产物不存在：$SRC"
              ls -la dist/ || true
              exit 1
          fi
          DEST="dist/cizha-vocab-${TAG}-${{ matrix.platform }}"
          [[ "${{ matrix.platform }}" == "windows-amd64" ]] && DEST="${DEST}.exe"
          mv "$SRC" "$DEST"
          echo "✅ 产物就绪：$DEST"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cizha-backend-${{ matrix.platform }}
          path: dist/*

  # -------- 汇总：等三条都完成后挂到 Release --------
  release:
    name: 创建 Release + 挂附件
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: 合并到一个目录
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          mkdir -p dist/release
          find dist/ -maxdepth 2 -type f -name "cizha-vocab-*" -exec mv {} dist/release/ \;
          echo "Release 附件："
          ls -lh dist/release/

      # softprops/action-gh-release：tag 对应的 Release 不存在会自动创建
      # generate_release_notes 自动生成该 tag 与上一个 tag 之间的 commits 列表
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
