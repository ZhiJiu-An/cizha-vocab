name: CI

# 推送 main 分支、或向任意分支提 PR 时自动运行
on:
  push:
    branches: [main]
  pull_request:

# 同一分支有新推送时，自动取消上一次尚未跑完的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 ruff + 单元测试
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # ruff 的 target-version 为 py310，这里用 3.12 兼顾「能跑」与「向前兼容」
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: 代码风格检查（ruff）
        run: ruff check app tests

      # 用例数会持续增长，这里不再写死数字（历史上写过 73，早已过期）
      - name: 单元测试（unittest）
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 用 ci 严格按 lock 安装：lock 与 package.json 不一致时立即失败
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建
        run: npm run build

      - name: 校验构建产物
        run: |
          test -f dist/index.html
          test -d dist/assets
